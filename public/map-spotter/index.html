<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Map Spotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a classroom atlas — pale sea, sage land, one bold prompt bar over a full-width map. */
:root {
  --bg: #eef3f1;
  --panel: #ffffff;
  --ink: #1c2a35;
  --muted: #5b6b74;
  --line: #d6e0de;
  --sea: #cfe2ea;
  --land: #b8d8a4;
  --land-hover: #9cc985;
  --ctx: #e3e1d6;
  --border: #f7faf7;
  --accent: #1f5d8c;
  --accent-ink: #ffffff;
  --c1: #23913c;
  --c2: #f0bf25;
  --c3: #f191bd;
  --c4: #dd3b31;
  --wrong-flash: #7a8a96;
  --shadow: 0 1px 2px rgba(28,42,53,.08), 0 6px 20px rgba(28,42,53,.08);
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a20; --panel: #1a252d; --ink: #e8eef0; --muted: #9aaab3; --line: #2b3a44;
    --sea: #16303f; --land: #4d7d52; --land-hover: #5f9564; --ctx: #2c353a; --border: #16303f;
    --accent: #6fb3e6; --accent-ink: #0d1a22; --c1: #3cc45a; --c2: #f3c73a; --c3: #f39cc5; --c4: #f0584d;
    --wrong-flash: #a9b8c2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a20; --panel: #1a252d; --ink: #e8eef0; --muted: #9aaab3; --line: #2b3a44;
  --sea: #16303f; --land: #4d7d52; --land-hover: #5f9564; --ctx: #2c353a; --border: #16303f;
  --accent: #6fb3e6; --accent-ink: #0d1a22; --c1: #3cc45a; --c2: #f3c73a; --c3: #f39cc5; --c4: #f0584d;
  --wrong-flash: #a9b8c2; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px;
  padding-inline: 16px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* ---------- home ---------- */
#home { max-width: 1060px; margin: 0 auto; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-size: clamp(34px, 5vw, 48px); font-weight: 700; letter-spacing: -.5px; }
.brand h1 span { color: var(--c1); }
.brand p { margin: 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
.setup { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.setup-label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.region-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
}
.region-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--c1); }
.region-card svg { width: 100%; height: 120px; display: block; background: var(--sea); border-radius: 9px; }
.region-card svg path { fill: var(--land); stroke: none; }
.region-card:hover svg path { fill: var(--c1); }
.rc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rc-name { font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.rc-count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rc-best { font-size: 13px; color: var(--muted); }
.rc-best b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid rgba(0,0,0,.12); }

/* ---------- game ---------- */
#game { height: 100%; display: flex; flex-direction: column; padding-block: 12px; gap: 10px; max-width: 1400px; margin: 0 auto; }
.bar {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow);
}
.back { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 14px; color: var(--muted); }
.back:hover { color: var(--ink); border-color: var(--muted); }
.prompt { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.prompt-find { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }
.prompt-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 38px); line-height: 1.1; }
.prompt-name.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.85); opacity: .3 } 100% { transform: scale(1); opacity: 1 } }
.feedback { font-size: 15px; font-weight: 700; min-height: 1.4em; color: var(--muted); }
.feedback.good { color: var(--c1); }
.feedback.bad { color: var(--c4); }
.stats { display: flex; align-items: center; gap: 16px; }
.tries { display: flex; gap: 6px; }
.tries i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: block; transition: background .2s, transform .2s; }
.tries i.used { background: var(--line); transform: scale(.8); }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.stat small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.stat b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--c1); transition: width .3s ease; }

.mapwrap { position: relative; flex: 1; min-height: 300px; background: var(--sea); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); touch-action: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#map.panning { cursor: grabbing; }
#map .ctx path { fill: var(--ctx); stroke: var(--border); stroke-width: .6; vector-effect: non-scaling-stroke; }
#map .land path { fill: var(--land); stroke: var(--border); stroke-width: .9; vector-effect: non-scaling-stroke; }
#map .c { fill: var(--land); stroke: var(--border); stroke-width: .9; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .25s; }
#map .c:hover, #map .c.hover { fill: var(--land-hover); }
#map .s1 { fill: var(--c1) !important; }
#map .s2 { fill: var(--c2) !important; }
#map .s3 { fill: var(--c3) !important; }
#map .s4 { fill: var(--c4) !important; }
#map .flash { fill: var(--wrong-flash) !important; transition: none; }
#map .target { animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { from { fill: var(--c4); } to { fill: var(--panel); } }
#map .land ~ .dots .dot { fill: var(--panel); }
#map .land ~ .dots .dot:hover, #map .land ~ .dots .dot.hover { fill: var(--land-hover); }
#map .dot { stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#map .leader { stroke: var(--ink); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; fill: none; }
#map .hit { fill: transparent; stroke: none; cursor: pointer; }
.modes { position: absolute; left: 10px; top: 10px; box-shadow: var(--shadow); }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; font-weight: 800; box-shadow: var(--shadow); display: grid; place-items: center; }
.zoom button:hover { border-color: var(--muted); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 10px; border-radius: 8px; }
.namechip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 8px; transform: translate(-50%, -130%); white-space: nowrap; opacity: 0; transition: opacity .15s; }
.namechip.show { opacity: 1; }

/* ---------- results ---------- */
.results { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 35%, transparent); }
.card { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 24px; width: min(440px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
.card h2 { font-size: 22px; font-weight: 600; color: var(--muted); }
.big { font-family: var(--f-display); font-size: 76px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.verdict { font-weight: 800; font-size: 18px; }
.breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.breakdown div { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.breakdown b { font-variant-numeric: tabular-nums; min-width: 2ch; }
.missed { font-size: 14px; color: var(--muted); line-height: 1.5; }
.missed b { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn:hover { filter: brightness(1.07); }
.scoring { font-size: 12.5px; color: var(--muted); }

@media (max-width: 640px) {
  .bar { grid-template-columns: 1fr auto; }
  .prompt { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  #map .target { animation: none; fill: var(--c4); stroke: var(--ink); stroke-width: 3; }
}
</style>

<script>
/* Anonymous usage counts: what was used, never who. No cookies, no IDs. */
window.scHit = function (d) {
  try {
    if (localStorage.getItem("smartcubby.nocount") === "1") return;
  } catch (e) {}
  try {
    var b = JSON.stringify(d);
    if (navigator.sendBeacon && navigator.sendBeacon("/api/hit", new Blob([b], { type: "application/json" }))) return;
    fetch("/api/hit", { method: "POST", body: b, keepalive: true, headers: { "content-type": "application/json" } }).catch(function () {});
  } catch (e) {}
};
scHit({ e: "view", p: "map-spotter" });
</script>
<main id="home">
  <a href="/" style="align-self:flex-start;color:var(--muted);font-weight:800;font-size:14px;text-decoration:none">&larr; Smart Cubby</a>

      <button id="cnt20" data-n="20" aria-pressed="false">20</button>
      <button id="cntAll" data-n="0" aria-pressed="true">All</button>
    </div>
  </div>
  <div class="regions" id="regions"></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--c1)"></i>First try</span>
    <span><i class="sw" style="background:var(--c2)"></i>Second try</span>
    <span><i class="sw" style="background:var(--c3)"></i>Third try</span>
    <span><i class="sw" style="background:var(--c4)"></i>Missed</span>
  </div>
</main>

<main id="game" hidden>
  <div class="bar">
    <button class="back" id="backBtn">← Maps</button>
    <div class="prompt" aria-live="polite">
      <span class="prompt-find">Find</span>
      <span class="prompt-name" id="promptName">France</span>
      <span class="feedback" id="feedback">Click the country on the map.</span>
    </div>

      <div class="tries" id="tries" aria-label="Tries left"><i></i><i></i><i></i></div>
      <div class="stat"><small>Done</small><b id="progressText">0/0</b></div>
      <div class="stat"><small>Score</small><b id="scoreText">–</b></div>
    </div>
  </div>
  <div class="progress"><div id="progressFill"></div></div>

    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="seg modes" id="modeSeg" role="group" aria-label="What to find" hidden></div>
    <div class="zoom">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomReset" aria-label="Reset zoom" style="font-size:14px">⤢</button>
    </div>
    <div class="hint">Scroll or use + to zoom. Drag to move the map.</div>
    <div class="namechip" id="namechip"></div>
    <div class="results" id="results" hidden></div>
  </div>
</main>

  // The menu (names, sizes, outlines) is in the page. Each full map is a separate file in maps/,
  // downloaded the first time it is played, so the page stays small.
  const MENU = JSON.parse(document.getElementById("mapmenu").textContent);
  const MAPS = {}; // key -> full map, once downloaded
  const ORDER = ["usa", "manhattan", "europe", "asia", "africa", "namerica", "samerica", "oceania"];
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  // What a map's places are called ("states", "neighborhoods"...).
  const unitOf = (key) => MENU[key].unit || (key === "usa" ? "states" : "countries");
  // A map can have more than one mode (Manhattan: neighborhoods or landmarks). Only the main map gets a
  // card; the others have "parent" set. Each mode is its own map file, best score and address.
  const baseOf = (key) => MENU[key].parent || key;
  const modesOf = (key) => Object.keys(MENU).filter((k) => k === baseOf(key) || MENU[k].parent === baseOf(key));
  // Addresses: /map-spotter/manhattan, /map-spotter/manhattan/landmarks
  const HOME_URL = "/map-spotter/";
  const urlOf = (key) => { const p = MENU[key].parent; return HOME_URL + (p ? p + "/" + key.slice(p.length + 1) : key); };
  const keyFromUrl = () => {
    const key = location.pathname.replace(/^\/map-spotter\/?/, "").split("/").filter(Boolean).join("-");
    return MENU[key] ? key : null;
  };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let howMany = store.get("ms-howmany");
  if (howMany == null) howMany = 0;

  // ---------- home ----------
  function renderHome() {
    const wrap = $("regions");
    wrap.innerHTML = "";
    for (const key of ORDER) {
      const r = MENU[key];
      const best = store.get("ms-best-" + key);
      const b = document.createElement("button");
      b.className = "region-card";
      b.id = "region-" + key;
      b.innerHTML =
        '<svg viewBox="0 0 ' + r.w + " " + r.h + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="' + r.thumb + '"/></svg>' +
        '<div class="rc-row"><span class="rc-name">' + r.label + '</span><span class="rc-count">' + r.count + " " + unitOf(key) + "</span></div>" +
        '<div class="rc-best">' + (best != null ? "Best score: <b>" + best + "%</b>" : "Not played yet") + "</div>";
      b.addEventListener("click", () => startGame(key));
      wrap.appendChild(b);
    }
    for (const btn of $("countSeg").querySelectorAll("button")) {
      btn.setAttribute("aria-pressed", String(+btn.dataset.n === howMany));
    }
  }
  $("countSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    howMany = +btn.dataset.n;
    store.set("ms-howmany", howMany);
    renderHome();
  });

  // ---------- game state ----------
  let G = null; // current game
  const POINTS = { 1: 100, 2: 67, 3: 33, 4: 0 };

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  async function loadMap(key) {
    if (!MAPS[key]) {
      const res = await fetch("/map-spotter/maps/" + key + ".json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      // A map with "base" (Manhattan Landmarks) holds only its own places. The base map's
      // places are drawn under them as plain land, with the base map's grey background.
      if (data.base) {
        const base = await loadMap(data.base);
        data.land = base.game.map((g) => g.d).filter(Boolean);
        data.context = base.context;
      }
      MAPS[key] = Object.assign({}, MENU[key], data);
    }
    return MAPS[key];
  }

  let loading = false;
  // nav: "push" adds the map's address to the history, "replace" swaps it (mode switch),
  // "none" leaves it (the address already says this map: page load, back/forward).
  async function startGame(key, onlyIds, nav = "push") {
    if (loading) return;
    let r = MAPS[key];
    if (!r) {
      const card = $("region-" + baseOf(key));
      const note = card && card.querySelector(".rc-best");
      const before = note ? note.innerHTML : "";
      loading = true;
      if (note) note.textContent = "Loading map…";
      try {
        r = await loadMap(key);
      } catch (e) {
        if (note) note.textContent = "Couldn't load this map. Check your connection and try again.";
        return;
      } finally {
        loading = false;
      }
      if (note) note.innerHTML = before;
    }
    let pool = r.game.map((g) => g.id);
    if (onlyIds) pool = pool.filter((id) => onlyIds.includes(id));
    shuffle(pool);
    if (!onlyIds && howMany > 0) pool = pool.slice(0, howMany);
    G = { key, r, queue: pool, idx: 0, misses: 0, revealed: false, results: {}, locked: false, practice: !!onlyIds };
    if (nav !== "none" && location.pathname !== urlOf(key)) history[nav === "replace" ? "replaceState" : "pushState"](null, "", urlOf(key));
    document.title = r.label + " · Map Spotter";
    drawModes();
    $("home").hidden = true;
    $("game").hidden = false;
    $("results").hidden = true;
    buildMap(r);
    nextQuestion(true);
    window.scHit && scHit({ e: "ms_start", region: key });
  }

  function drawModes() {
    const modes = modesOf(G.key), seg = $("modeSeg");
    seg.hidden = modes.length < 2;
    seg.innerHTML = modes.map((k) => '<button data-key="' + k + '" aria-pressed="' + (k === G.key) + '">' + MENU[k].mode + "</button>").join("");
  }
  $("modeSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (btn && G && btn.dataset.key !== G.key) startGame(btn.dataset.key, null, "replace");
  });

  // ---------- map ----------
  let VB = null, VB0 = null;
  const shapes = new Map(); // id -> [elements]

  function el(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function buildMap(r) {
    const svg = $("map");
    svg.innerHTML = "";
    shapes.clear();
    VB0 = [0, 0, r.w, r.h];
    VB = VB0.slice();
    setVB();
    svg.appendChild(el("rect", { x: -5000, y: -5000, width: 10000 + r.w, height: 10000 + r.h, fill: "transparent" }));
    const ctx = el("g", { class: "ctx" });
    for (const d of r.context) ctx.appendChild(el("path", { d }));
    svg.appendChild(ctx);
    if (r.land) {
      const land = el("g", { class: "land" });
      for (const d of r.land) land.appendChild(el("path", { d }));
      svg.appendChild(land);
    }
    const gGame = el("g", { class: "game" });
    const gDots = el("g", { class: "dots" });
    const unit = r.w / 1000;
    for (const g of r.game) {
      const list = [];
      if (g.d) {
        const p = el("path", { d: g.d, class: "c", "data-id": g.id });
        gGame.appendChild(p); list.push(p);
      }
      if (g.dot) {
        const mx = g.mx ?? g.cx, my = g.my ?? g.cy;
        if (Math.hypot(mx - g.cx, my - g.cy) > 2) {
          gDots.appendChild(el("line", { x1: g.cx, y1: g.cy, x2: mx, y2: my, class: "leader" }));
        }
        const c = el("circle", { cx: mx, cy: my, r: 7.5 * unit, class: "c dot", "data-id": g.id });
        gDots.appendChild(c); list.push(c);
        const hit = el("circle", { cx: mx, cy: my, r: 9.5 * unit, class: "hit", "data-id": g.id });
        gDots.appendChild(hit);
      }
      shapes.set(g.id, list);
    }
    svg.appendChild(gGame);
    svg.appendChild(gDots);
  }

  function setVB() { $("map").setAttribute("viewBox", VB.map((v) => v.toFixed(2)).join(" ")); }

  function zoomAt(factor, cx, cy) {
    const [x, y, w, h] = VB;
    let nw = w / factor, nh = h / factor;
    const minW = VB0[2] / 8;
    if (nw < minW) { nw = minW; nh = VB0[3] / 8; }
    if (nw > VB0[2]) { nw = VB0[2]; nh = VB0[3]; }
    if (cx == null) { cx = x + w / 2; cy = y + h / 2; }
    const fx = (cx - x) / w, fy = (cy - y) / h;
    VB = clampVB([cx - fx * nw, cy - fy * nh, nw, nh]);
    setVB();
  }
  function clampVB([x, y, w, h]) {
    const pad = 0.25;
    x = Math.min(Math.max(x, -w * pad), VB0[2] - w * (1 - pad));
    y = Math.min(Math.max(y, -h * pad), VB0[3] - h * (1 - pad));
    return [x, y, w, h];
  }
  function clientToSvg(evt) {
    const svg = $("map");
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  $("zoomIn").addEventListener("click", () => zoomAt(1.5));
  $("zoomOut").addEventListener("click", () => zoomAt(1 / 1.5));
  $("zoomReset").addEventListener("click", () => { VB = VB0.slice(); setVB(); });
  $("map").addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = clientToSvg(e);
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y);
  }, { passive: false });

  // drag to pan, click to answer
  let drag = null;
  const svgEl = $("map");
  svgEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, vb: VB.slice(), moved: false, id: e.pointerId };
  });
  window.addEventListener("pointermove", (e) => {
    if (drag && drag.id === e.pointerId) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; svgEl.classList.add("panning"); hideChip(); }
      if (drag.moved) {
        const m = svgEl.getScreenCTM();
        const s = m ? m.a : 1;
        VB = clampVB([drag.vb[0] - dx / s, drag.vb[1] - dy / s, drag.vb[2], drag.vb[3]]);
        setVB();
      }
    }
  });
  window.addEventListener("pointerup", (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    const wasDrag = drag.moved;
    drag = null;
    svgEl.classList.remove("panning");
    if (wasDrag) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const id = t && t.closest && t.closest("[data-id]") ? t.closest("[data-id]").dataset.id : null;
    if (id && svgEl.contains(t)) onPick(id, e);
  });

  // hover highlight for dots + their hit circles
  svgEl.addEventListener("pointerover", (e) => {
    const t = e.target.closest("[data-id]");
    if (!t) return;
    for (const s of shapes.get(t.dataset.id) || []) s.classList.add("hover");
  });
  svgEl.addEventListener("pointerout", (e) => {
    const t = e.target.closest("[data-id]");
    if (!t) return;
    for (const s of shapes.get(t.dataset.id) || []) s.classList.remove("hover");
  });

  // ---------- name chip ----------
  let chipTimer = null;
  function showChip(text, evt) {
    const chip = $("namechip");
    const box = $("mapwrap").getBoundingClientRect();
    chip.textContent = text;
    chip.style.left = (evt.clientX - box.left) + "px";
    chip.style.top = (evt.clientY - box.top) + "px";
    chip.classList.add("show");
    clearTimeout(chipTimer);
    chipTimer = setTimeout(hideChip, 1400);
  }
  function hideChip() { $("namechip").classList.remove("show"); }

  // ---------- questions ----------
  const nameOf = (id) => G.r.game.find((g) => g.id === id).name;

  function nextQuestion(first) {
    if (G.idx >= G.queue.length) return finish();
    G.misses = 0; G.revealed = false; G.locked = false;
    const id = G.queue[G.idx];
    const pn = $("promptName");
    pn.textContent = nameOf(id);
    pn.classList.remove("pop"); void pn.offsetWidth; pn.classList.add("pop");
    setFeedback(first ? "Click it on the map." : "", "");
    drawTries();
    drawProgress();
  }

  function setFeedback(text, kind) {
    const f = $("feedback");
    f.textContent = text;
    f.className = "feedback" + (kind ? " " + kind : "");
  }
  function drawTries() {
    const dots = $("tries").children;
    for (let i = 0; i < 3; i++) dots[i].classList.toggle("used", i < G.misses);
  }
  function currentScore() {
    const vals = Object.values(G.results);
    if (!vals.length) return null;
    return Math.round(vals.reduce((s, v) => s + POINTS[v], 0) / vals.length);
  }
  function drawProgress() {
    const done = Object.keys(G.results).length;
    $("progressText").textContent = done + "/" + G.queue.length;
    $("progressFill").style.width = (100 * done / G.queue.length) + "%";
    const sc = currentScore();
    $("scoreText").textContent = sc == null ? "–" : sc + "%";
  }

  function paint(id, cls) {
    for (const s of shapes.get(id) || []) {
      s.classList.remove("s1", "s2", "s3", "s4", "target", "flash");
      if (cls) s.classList.add(cls);
    }
  }

  function onPick(id, evt) {
    if (!G || G.locked) return;
    const target = G.queue[G.idx];
    if (G.revealed) {
      if (id === target) {
        G.results[target] = 4;
        paint(target, "s4");
        advance(900);
        setFeedback("That's " + nameOf(target) + ". You'll get it next time!", "");
      } else {
        showChip(nameOf(id), evt);
        setFeedback("Click the flashing one: " + nameOf(target) + ".", "bad");
      }
      return;
    }
    if (id === target) {
      const attempt = G.misses + 1;
      G.results[target] = attempt;
      paint(target, "s" + attempt);
      const msg = attempt === 1 ? "Correct, first try!" : attempt === 2 ? "Got it on the second try!" : "Got it on the third try!";
      setFeedback(msg, "good");
      showChip(nameOf(target), evt);
      advance(850);
      return;
    }
    // wrong
    G.misses++;
    drawTries();
    showChip("That's " + nameOf(id), evt);
    flashWrong(id);
    if (G.misses >= 3) {
      G.revealed = true;
      for (const s of shapes.get(target) || []) s.classList.add("target");
      setFeedback("Out of tries. " + nameOf(target) + " is flashing. Click it to keep going.", "bad");
    } else {
      const left = 3 - G.misses;
      setFeedback("Not quite. " + left + (left === 1 ? " try" : " tries") + " left.", "bad");
    }
  }

  function flashWrong(id) {
    const els = shapes.get(id) || [];
    for (const s of els) s.classList.add("flash");
    setTimeout(() => { for (const s of els) s.classList.remove("flash"); }, 450);
  }

  function advance(ms) {
    G.locked = true;
    drawProgress();
    setTimeout(() => { G.idx++; nextQuestion(false); }, ms);
  }

  // ---------- results ----------
  function finish() {
    const score = currentScore() ?? 0;
    const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
    for (const v of Object.values(G.results)) counts[v]++;
    const needPractice = G.queue.filter((id) => G.results[id] > 1);
    const missed = G.queue.filter((id) => G.results[id] === 4).map(nameOf).sort();
    window.scHit && scHit({ e: "ms_finish", region: G.key, score: score, n: G.queue.length });

    let newBest = false;
    if (!G.practice && howMany === 0) {
      const prev = store.get("ms-best-" + G.key);
      if (prev == null || score > prev) { store.set("ms-best-" + G.key, score); newBest = prev != null; }
    }
    const verdict = score >= 90 ? "Outstanding map skills!" : score >= 75 ? "Great job!" : score >= 50 ? "Good work. Keep practicing!" : "Nice start. Practice makes it stick!";
    const unit = unitOf(G.key);

    const box = $("results");
    box.innerHTML =
      '<div class="card" role="dialog" aria-label="Results">' +
        "<h2>" + G.r.label + (G.practice ? " · practice round" : "") + "</h2>" +
        '<div class="big">' + score + "%</div>" +
        '<div class="verdict">' + verdict + (newBest ? " New best score!" : "") + "</div>" +
        '<div class="breakdown">' +
          '<div><i class="sw" style="background:var(--c1)"></i><b>' + counts[1] + "</b> first try</div>" +
          '<div><i class="sw" style="background:var(--c2)"></i><b>' + counts[2] + "</b> second try</div>" +
          '<div><i class="sw" style="background:var(--c3)"></i><b>' + counts[3] + "</b> third try</div>" +
          '<div><i class="sw" style="background:var(--c4)"></i><b>' + counts[4] + "</b> missed</div>" +
        "</div>" +
        (missed.length ? '<div class="missed">Missed: <b>' + missed.join(", ") + "</b></div>" : "") +
        '<div class="actions">' +
          (needPractice.length ? '<button class="btn" id="practiceBtn">Practice the ' + needPractice.length + " tricky " + (needPractice.length === 1 ? unit.slice(0, -1).replace(/ie$/, "y") : unit) + "</button>" : "") +
          '<button class="btn ' + (needPractice.length ? "ghost" : "") + '" id="againBtn">Play again</button>' +
          '<button class="btn ghost" id="mapsBtn">Choose another map</button>' +
          '<button class="btn ghost" id="viewBtn">Look at my map</button>' +
        "</div>" +
        '<div class="scoring">Scoring: first try 100 points, second try 67, third try 33, missed 0. Your score is the average.</div>' +
      "</div>";
    box.hidden = false;
    $("promptName").textContent = "All done!";
    setFeedback("", "");
    const key = G.key;
    if ($("practiceBtn")) $("practiceBtn").onclick = () => startGame(key, needPractice);
    $("againBtn").onclick = () => startGame(key);
    $("mapsBtn").onclick = goHome;
    $("viewBtn").onclick = () => {
      box.hidden = true;
      setFeedback("Here's your finished map. ", "");
      const f = $("feedback");
      const b = document.createElement("button");
      b.className = "btn"; b.style.padding = "4px 10px"; b.style.fontSize = "13px"; b.textContent = "Show score";
      b.onclick = () => { box.hidden = false; };
      f.appendChild(b);
    };
    G.locked = true;
  }

  function goHome(fromHistory) {
    if (fromHistory !== true && location.pathname !== HOME_URL) history.pushState(null, "", HOME_URL);
    document.title = "Map Spotter";
    G = null;
    $("game").hidden = true;
    $("home").hidden = false;
    renderHome();
  }
  $("backBtn").addEventListener("click", goHome);

  // Show what the address asks for: a map, or the list of maps.
  function route() {
    const key = keyFromUrl();
    if (key) { if (!G || G.key !== key) startGame(key, null, "none"); return; }
    if (location.pathname !== HOME_URL) history.replaceState(null, "", HOME_URL);
    if (G) goHome(true); else renderHome();
  }
  window.addEventListener("popstate", route);
  route();
})();
</script>

</body></html>
